<header class="header">
  <a class="btn btn__icon--back" [routerLink]="['/home']"></a>
  <h2 class="text__primary">Signup</h2>
  <div></div>
</header>

<div class="signup">
  <form class="form" [formGroup]="userSignup" (ngSubmit)="sendNewUser()">
    <div class="form__group">
      <div class="form__group--split">
        <label for="firstName"></label>
        <input
          class="form__input w-100"
          [class.invalid]="
          this.submitted() &&
            userSignup.controls.firstName.invalid
          "
          [class.valid]="
            userSignup.controls.firstName.valid &&
            userSignup.controls.firstName.touched &&
            userSignup.controls.firstName.dirty
          "
          placeholder="Vorname"
          type="text"
          name="firstName"
          id="firstName"
          autocomplete="given-name"
          formControlName="firstName"
        />
        <span
          class="error"
          [class.hide]="userSignup.controls.firstName.valid && userSignup.controls.firstName.dirty"
          ><i class="error__message">{{ error() }}</i></span
        >
      </div>

      <div class="form__group--split">
        <label for="lastName"></label>
        <input
          class="form__input w-100"
          [class.invalid]="
            userSignup.controls.lastName.invalid &&
            this.submitted()
          "
          [class.valid]="
            userSignup.controls.lastName.valid &&
            userSignup.controls.lastName.touched &&
            userSignup.controls.lastName.dirty
          "
          placeholder="Nachname"
          type="text"
          name="lastName"
          id="lastName"
          autocomplete="family-name"
          formControlName="lastName"
        />
        <span
          class="error"
          [class.hide]="userSignup.controls.lastName.valid && userSignup.controls.lastName.dirty"
          ><i class="error__message">{{ error() }}</i></span
        >
      </div>
    </div>

    <div>
      <label for="email"></label>
      <input
        class="form__input"
        [class.invalid]="
          userSignup.controls.email.invalid &&
          this.submitted()
        "
        [class.valid]="
          userSignup.controls.email.valid &&
          userSignup.controls.email.touched &&
          userSignup.controls.email.dirty
        "
        placeholder="Email"
        type="email"
        name="email"
        id="email"
        autocomplete="email"
        formControlName="email"
      />
      <span
        class="error"
        [class.hide]="userSignup.controls.email.valid && userSignup.controls.email.dirty"
        ><i class="error__message">{{ error() }}</i></span
      >
    </div>

    <div>
      <label for="password"></label>
      <input
        class="form__input"
        [class.invalid]="
          userSignup.controls.password.invalid &&
          this.submitted()
        "
        [class.valid]="
          userSignup.controls.password.valid &&
          userSignup.controls.password.touched &&
          userSignup.controls.password.dirty
        "
        placeholder="Passwort"
        type="password"
        name="password"
        id="password"
        autocomplete="new-password"
        formControlName="password"
      />
      <span
        class="error"
        [class.hide]="userSignup.controls.password.valid && userSignup.controls.password.dirty"
        ><i class="error__message">{{ error() }}</i></span
      >
    </div>

    <div>
      <label for="passwordConfirm"></label>
      <input
        class="form__input"
        [class.invalid]="
          userSignup.controls.passwordConfirm.invalid &&
          this.submitted()
        "
        [class.valid]="
          userSignup.controls.passwordConfirm.valid &&
          userSignup.controls.passwordConfirm.touched &&
          userSignup.controls.passwordConfirm.dirty
        "
        placeholder="Passwort"
        type="password"
        name="passwordConfirm"
        id="passwordConfirm"
        autocomplete="new-password"
        formControlName="passwordConfirm"
      />
      <span
        class="error"
        [class.hide]="
          userSignup.controls.passwordConfirm.valid && userSignup.controls.passwordConfirm.dirty
        "
        ><i class="error__message">{{ error() }}</i></span
      >
    </div>

    <button class="btn btn__submit" type="submit">Submit</button>
  </form>
</div>
