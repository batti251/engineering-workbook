<ul class="list">
@for (
  item of formArray.controls;
  track item;
  let itemIndex = $index
) {
  <li class="item">
    @switch (true) {
                    @case ($first && !$last) {
                      <button
                        [id]="itemIndex"
                        type="button"
                        class="arrow__btn"
                        (click)="change(formArray.controls, itemIndex, 'moveDown')"
                      >
                        &gt;
                      </button>
                    }
                    @case (!$first && $last) {
                      <button
                        [id]="itemIndex"
                        type="button"
                        class="arrow__btn"
                        (click)="changePosition(itemIndex, 'shiftLeft')"
                      >
                        &lt;
                      </button>
                    }
                    @default {
                      <button
                        [id]="itemIndex"
                        type="button"
                        class="arrow__btn"
                        (click)="change(formArray.controls, itemIndex, 'moveUp')"
                      >
                        &lt;
                      </button>
                      <button
                        [id]="itemIndex"
                        type="button"
                        class="arrow__btn"
                        (click)="change(formArray.controls, itemIndex, 'moveDown')"
                      >
                        &gt;
                      </button>
                    }
                  }

      <label for="{{target}}-{{ indexSubEntry }}.{{ itemIndex }}"></label>
      <input
        id="{{target}}-{{ indexSubEntry }}.{{ itemIndex }}"
        type="text"
        [formControl]="item"
        class="text__tertiary form__input"
        placeholder="add {{target}} here"
      />
    <button
      type="button"
      (click)="forms.removeSubEntryControl(indexSubEntry, itemIndex, target)"
      class="btn btn__icon--delete"
    ></button>
  </li>
}
</ul>
