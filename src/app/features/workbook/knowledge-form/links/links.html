@for (
  item of formArray.controls;
  track item;
  let itemIndex = $index
) {
  <div class="form__wrap--input">
    <button
      type="button"
      (click)="forms.addSubEntryControls(indexSubEntry, target)"
      class="btn btn__icon--add"
    ></button>
    <div class="form__wrap g-0">
      <label for="link-{{ indexSubEntry }}.{{ itemIndex }}"></label>
      <input
        id="link-{{ indexSubEntry }}.{{ itemIndex }}"
        type="text"
        [formControl]="item"
        class="form__input text__primary--input"
        placeholder="add {{target}} here"
      />
    </div>
    <button
      type="button"
      (click)="forms.removeSubEntryControl(indexSubEntry, itemIndex, target)"
      class="btn btn__icon--delete"
      [disabled]="$first"
    ></button>
  </div>
} @empty {
  <button
    type="button"
    (click)="forms.addSubEntryControls(indexSubEntry, target)"
    class="btn btn__icon--add"
  ></button>
}
