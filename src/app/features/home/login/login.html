<section>
  <h2 class="text__primary text__primary--h2">Login</h2>

  <p class="authentication text__primary--basic">
    No account, yet? Create your personal Account here:
    <a class="btn btn__signup" [routerLink]="['/signup']">Signup</a>
  </p>

  @if (!auth.isActiveSession()) {
    <form class="form" [formGroup]="form.signInForm" (submit)="sendCredentials(email, password)">
      <div class="login__input">
        <label for="email_input" class="text__primary">Email</label>
        <input
          (focus)="isError.set(false)"
          class="form__input text__regular"
          [class.error__border]="isError()"
          id="email_input"
          type="email"
          formControlName="email"
        />
      </div>
      <div class="login__input">
        <label for="password_input" class="text__primary">Passwort</label>
        <input
          (focus)="isError.set(false)"
          class="form__input text__regular"
          [class.error__border]="isError()"
          id="password_input"
          type="password"
          autocomplete="off"
          formControlName="password"
        />
      </div>

      <div class="message--error">
        @if (isError()) {
          <span class="text__regular" [class.error__text]="isError()">{{
            this.auth.errorMessage()
          }}</span>
        }
      </div>

      <button class="btn btn__submit" type="submit">Sign In</button>
    </form>
  }
</section>
