<section>
  <h2 class="text__primary">Login</h2>

  <p class="signup__text text__tertiary">
    No account, yet? Create your personal Account here:
    <a class="btn btn__signup" [routerLink]="['/signup']">Signup</a>
  </p>

  @if (!auth.isActiveSession()) {
    <form class="form" [formGroup]="form.signInForm" (submit)="sendCredentials(email, password)">
      <div class="login__input">
        <label for="email" class="text__primary">Email</label>
        <input
          (focus)="isError.set(false)"
          class="form__input text__primary"
          [class.error__border]="isError()"
          id="email"
          type="email"
          autocomplete="email"
          formControlName="email"
        />
      </div>
      <div class="login__input">
        <label for="password" class="text__primary">Passwort</label>
        <input
          (focus)="isError.set(false)"
          class="form__input text__primary"
          [class.error__border]="isError()"
          id="password"
          type="password"
          autocomplete="off"
          formControlName="password"
        />
      </div>

      <div class="error"
      [class.show]="isError()">
        @if (isError()) {
          <span class="text__primary" [class.error__message]="isError()">{{
            this.auth.errorMessage()
          }}</span>
        }
      </div>

      <button class="btn btn__submit" type="submit">Sign In</button>
    </form>
  }
</section>
