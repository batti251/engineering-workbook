<main>
<div class="sub-header">
  <app-select (selectedValue)="getSelectedValue($event)"></app-select>
</div>
  @switch (selectedValue) {
    @case ("git") {
      <app-git [data]="filteredItems()"></app-git>
    }
    @case ("Python") {
      <app-python [data]="filteredItems()"></app-python>
    }
  }
</main>
