<form (ngSubmit)="sendDataToDB()" [formGroup]="forms.surveyForm" class="form">
  <label for="language">Language: </label>
  <input id="language" type="text" formControlName="language" />

  <label for="syntax">Syntax: </label>
  <input id="syntax" type="text" formControlName="syntax" />

  <label for="description">Description: </label>
  <input id="description" type="text" formControlName="description" />

  <label for="return_value">returnValue: </label>
  <input id="return_value" type="text" formControlName="return_value" />

  <div formArrayName="properties" class="form__group">
    <div class="header__nav">
      <h4>Properties:</h4>
      <button class="btn btn__icon--add" type="button" (click)="forms.addProperty()"></button>
    </div>
    <ul class="list">
      @for (item of forms.properties.controls; track item; let indexProperties = $index) {
        <li class="list list__element">
          <label for="properties-{{ indexProperties }}">{{ indexProperties + 1 }}: </label>
          <input
            id="properties-{{ indexProperties }}"
            type="text"
            [formControlName]="indexProperties"
          />
          <button
            class="btn btn__icon--cancel"
            type="button"
            (click)="forms.removeProperty(indexProperties)"
          ></button>
        </li>
      }
    </ul>
  </div>

  <div formArrayName="use_cases" class="form__group">
    <div class="header__nav">
      <h4>Use Cases:</h4>
      <button class="btn btn__icon--add" type="button" (click)="forms.addUseCase()"></button>
    </div>
    <ul class="list">
      @for (item of forms.useCases.controls; track item; let indexUseCase = $index) {
        <li class="list list__element">
          <label for="use_cases-{{ indexUseCase }}">{{ indexUseCase + 1 }}: </label>
          <input id="use_cases-{{ indexUseCase }}" type="text" [formControlName]="indexUseCase" />
          <button
            class="btn btn__icon--cancel"
            type="button"
            (click)="forms.removeUseCase(indexUseCase)"
          ></button>
        </li>
      }
    </ul>
  </div>

  <div formArrayName="screenshots">
    <div class="header__nav">
      <h4>Screenshots:</h4>
    </div>
    <app-screenshot-upload-area></app-screenshot-upload-area>
  </div>
  <button class="btn btn__icon--submit" type="submit"></button>
</form>
