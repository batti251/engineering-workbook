<p>coding works!</p>

<form (ngSubmit)="sendDataToDB()" [formGroup]="surveyForm" class="form">
  <label for="language">language: </label>
  <input id="language" type="text" formControlName="language" />
  <div>{{ surveyForm.get('language')?.value }}</div>

  <label for="title">title: </label>
  <input id="title" type="text" formControlName="title" />

  <label for="description">description: </label>
  <input id="description" type="text" formControlName="description" />

  <label for="syntax">syntax: </label>
  <input id="syntax" type="text" formControlName="syntax" />

  <label for="returnValue">returnValue: </label>
  <input id="returnValue" type="text" formControlName="returnValue" />

  <div formArrayName="useCases">
    @for (item of useCases.controls; track $index; let index = $index) {
      <label for="useCases-{{ index }}">useCase: </label>
      <input id="useCases-{{ index }}" type="text" [formControlName]="index" />
      <button [class.d-none]="!$last" type="button" (click)="addUseCase()">more useCases</button>
    }
  </div>
  <button type="submit">Submit</button>
</form>
