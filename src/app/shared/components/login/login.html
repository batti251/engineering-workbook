<div>
  <span>Status:</span>
  <span>{{signInStatus}}</span>
</div>

@if (!this.isActiveSession()) {
  <form [formGroup]="form.signInForm" (submit)="sendCredentials(email, password)">
    <label for="email_input">Email</label>
    <input id="email_input" type="email" formControlName="email" />

    <label for="password_input">Password</label>
    <input id="password_input" type="password" autocomplete="off" formControlName="password" />

    <button type="submit">Sign In</button>
  </form>
}
